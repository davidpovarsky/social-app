appId: ${APP_ID}
name: Existing fixture logs in through the default Torah provider and loads real posts
---
# This is deliberately a bare username. Full handles could auto-detect a PDS
# and hide a wrong-default regression. Never open or override the provider.
- assertVisible:
    id: selectServiceButton
- assertVisible:
    id: loginUsernameInput
- takeScreenshot: 20-initial-default-provider
- tapOn:
    id: loginUsernameInput
- inputText:
    text: ${FIXTURE_USERNAME}
    label: Enter existing project fixture username
- tapOn:
    id: loginPasswordInput
# The field stays secure. Maestro debug output is scrubbed before any upload.
- inputText:
    text: ${FIXTURE_PASSWORD}
    label: Enter existing project fixture password
- hideKeyboard
- tapOn:
    id: loginNextButton
- extendedWaitUntil:
    visible: 'בית|אולי מאוחר יותר'
    timeout: 90000
- runFlow:
    when:
      visible: 'אולי מאוחר יותר'
    commands:
      - tapOn: 'אולי מאוחר יותר'
- extendedWaitUntil:
    visible:
      id: HomeScreen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: postText
    timeout: 60000
# Native iPad windows >= 800pt use the sidebar compose button instead of a FAB.
- runFlow:
    when:
      true: ${NATIVE_SIDEBAR === 'true'}
    commands:
      - assertVisible: 'כתוב פוסט חדש'
- runFlow:
    when:
      true: ${NATIVE_SIDEBAR !== 'true'}
    commands:
      - assertVisible:
          id: composeFAB
- takeScreenshot: 21-authenticated-hebrew-feed
