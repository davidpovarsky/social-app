# Torah Social: Signup without invite code
# Verifies that the Torah Social PDS accepts account creation with no invite required.
appId: com.davidpovarsky.torahsocial
---
- launchApp:
    appId: "com.davidpovarsky.torahsocial"
    clearState: true

- extendedWaitUntil:
    visible:
      id: "createAccountButton"
    timeout: 30000

- tapOn:
    id: "createAccountButton"

# Select custom server - the Torah Social PDS
- tapOn:
    text: "Bluesky Social"
    optional: true

- runFlow:
    when:
      visible:
        id: "customSelectBtn"
    commands:
      - tapOn:
          id: "customSelectBtn"
      - tapOn:
          id: "customServerTextInput"
      - inputText: "${TORAH_PDS_HOST}"
      - tapOn:
          id: "doneBtn"

# Fill email and password
- extendedWaitUntil:
    visible:
      id: "emailInput"
    timeout: 10000

- tapOn:
    id: "emailInput"
- inputText: "${E2E_USER_A_EMAIL}"
- tapOn:
    id: "passwordInput"
- inputText: "${E2E_USER_A_PASSWORD}"

# Dismiss keyboard and advance
- tapOn:
    text: "Your account"
    optional: true
- tapOn:
    id: "nextBtn"

- waitForAnimationToEnd

# Verify invite code field is NOT required / not visible
- assertNotVisible:
    text: "Invite code is required"

# Tap away save-password prompt if present
- tapOn:
    point: "20%,20%"
    repeat: 2
    delay: 500
    optional: true

# Set handle
- extendedWaitUntil:
    visible:
      id: "handleInput"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible:
        id: "handleInput"
    commands:
      - tapOn:
          id: "handleInput"
      - inputText: "${E2E_USER_A_HANDLE}"
      - extendedWaitUntil:
          visible:
            id: "handleAvailableCheck"
          timeout: 15000
          optional: true
      - tapOn:
          id: "nextBtn"
          optional: true

- waitForAnimationToEnd

# Should reach onboarding or home - verify no error
- assertNotVisible:
    text: "Invite code is required"
- assertNotVisible:
    text: "Could not resolve handle"
- takeScreenshot: "signup-complete"