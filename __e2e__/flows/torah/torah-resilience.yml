# Torah Social: App resilience - force-close, background, relaunch
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000

# Open composer
- tapOn:
    id: "composeFAB"

- extendedWaitUntil:
    visible:
      id: "composerPublishBtn"
    timeout: 15000

# Cancel composer
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Discard"
    optional: true

# Ensure composer is dismissed
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 15000

# Background app
- pressKey: Home
- waitForAnimationToEnd

# Foreground app (resume from background without stopping/restarting)
- launchApp:
    appId: "com.davidpovarsky.torahsocial"
    stopApp: false

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 30000

- waitForAnimationToEnd

# Reopen composer after relaunch - verify no crash
- tapOn:
    id: "composeFAB"

- runFlow:
    when:
      notVisible:
        id: "composerPublishBtn"
    commands:
      - tapOn:
          id: "composeFAB"
          optional: true

- extendedWaitUntil:
    visible:
      id: "composerPublishBtn"
    timeout: 20000

- assertNotVisible:
    text: "ReferenceError"
- assertNotVisible:
    text: "TypeError"
- assertNotVisible:
    text: "Invariant Violation"

- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Discard"
    optional: true

- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 15000

- takeScreenshot: "resilience-success"