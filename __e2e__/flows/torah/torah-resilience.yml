# Torah Social: App resilience - force-close, background, relaunch
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000
# Open composer
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
# Cancel composer
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Discard"
    optional: true
# Background app
- pressKey: Home
- waitForAnimationToEnd
# Foreground app
- launchApp:
    appId: "com.davidpovarsky.torahsocial"
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 30000
# Reopen composer after relaunch - verify no crash
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- assertNotVisible:
    text: "ReferenceError"
- assertNotVisible:
    text: "TypeError"
- assertNotVisible:
    text: "Invariant Violation"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Discard"
    optional: true
- takeScreenshot: "resilience-success"