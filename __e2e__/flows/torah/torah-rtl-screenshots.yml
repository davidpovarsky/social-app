# Torah Social: Authentic Hebrew Localization & RTL Verification Flow
# Switches the app to Hebrew via in-app Settings, verifies Hebrew UI strings,
# and captures visual evidence of all core screens in Hebrew RTL mode.
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml

# 1. Open Navigation Drawer to access Settings
- runFlow:
    when:
      visible: "Open drawer menu"
    commands:
      - tapOn: "Open drawer menu"
- runFlow:
    when:
      notVisible: "Settings"
    commands:
      - swipe:
          start: "0%,50%"
          end: "70%,50%"
- runFlow:
    when:
      notVisible: "Settings"
    commands:
      - tapOn:
          id: "viewHeaderDrawerBtn"
          optional: true

# 2. Tap Settings from the drawer menu
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"

# 3. Scroll to Languages setting item and enter LanguageSettingsScreen
- scrollUntilVisible:
    element:
      text: "Languages"
    direction: DOWN
    timeout: 10000
- tapOn: "Languages"

# 4. Open App Language picker and select Hebrew
- extendedWaitUntil:
    visible: "App language"
    timeout: 10000
- tapOn:
    text: "Select app language"
    optional: true
- runFlow:
    when:
      notVisible: "עברית – Hebrew"
    commands:
      - tapOn: "App language"
- extendedWaitUntil:
    visible: "עברית – Hebrew"
    timeout: 10000
- tapOn: "עברית – Hebrew"

# 5. Verify Hebrew UI and RTL on Settings
- extendedWaitUntil:
    visible: "שפת האפליקציה"
    timeout: 15000
- assertVisible:
    text: "הגדרות"
    optional: true
- assertVisible:
    text: "שפות תוכן"
    optional: true
- takeScreenshot: "hebrew-settings"

# 6. Navigate to Home and capture Hebrew Home screen
- tapOn:
    id: "bottomBarHomeBtn"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "hebrew-home"

# 7. Navigate to Search and capture Hebrew Search screen
- tapOn:
    id: "bottomBarSearchBtn"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "hebrew-search"

# 8. Navigate to Profile and capture Hebrew Profile screen
- tapOn:
    id: "bottomBarProfileBtn"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "hebrew-profile"

# 9. Open Composer and capture Hebrew Composer screen
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "ביטול"
    timeout: 10000
- takeScreenshot: "hebrew-composer"

# Clean up composer
- tapOn:
    text: "ביטול"
    optional: true
- tapOn:
    text: "התעלם"
    optional: true