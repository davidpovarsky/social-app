# Torah Social: Login and session persistence
appId: xyz.blueskyweb.app
---
- runFlow:
    file: ../../setupApp.yml
- tapOn:
    id: "e2eOpenLoggedOutView"
    optional: true
- tapOn:
    text: "Sign in"
- tapOn:
    id: "selectServiceButton"
    optional: true
- tapOn:
    id: "manualSelectBtn"
    optional: true
- tapOn:
    id: "customServerTextInput"
    optional: true
- clearText
    optional: true
- inputText: "${TORAH_PDS_HOST}"
    optional: true
- pressKey: Enter
    optional: true
- tapOn:
    id: "doneBtn"
    optional: true
- tapOn:
    id: "loginUsernameInput"
- clearText
- inputText: "${E2E_USER_A_HANDLE}"
- tapOn:
    id: "loginPasswordInput"
- clearText
- inputText: "${E2E_USER_A_PASSWORD}"
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
# Verify home screen loads - proof login succeeded
- extendedWaitUntil:
    visible:
      id: "bottomBarHomeBtn"
    timeout: 30000
- assertNotVisible:
    text: "Invalid identifier or password"
- assertNotVisible:
    text: "Internal Server Error"