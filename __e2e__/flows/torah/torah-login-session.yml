# Torah Social: Login and session persistence
appId: xyz.blueskyweb.app
---
- launchApp:
    appId: "xyz.blueskyweb.app"

- runFlow:
    when:
      notVisible:
        id: "bottomBarHomeBtn"
    commands:
      - tapOn:
          id: "signInButton"
          optional: true
      - tapOn:
          text: "Sign in"
          optional: true
      - runFlow:
          when:
            visible:
              id: "selectServiceButton"
          commands:
            - tapOn:
                id: "selectServiceButton"
            - tapOn:
                id: "manualSelectBtn"
                optional: true
            - tapOn:
                id: "customServerTextInput"
                optional: true
            - inputText: "${TORAH_PDS_HOST}"
            - tapOn:
                id: "doneBtn"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "loginUsernameInput"
          timeout: 10000
      - tapOn:
          id: "loginUsernameInput"
      - inputText: "${E2E_USER_A_EMAIL}"
      - tapOn:
          id: "loginPasswordInput"
      - inputText: "${E2E_USER_A_PASSWORD}"
      - pressKey: Enter
      - tapOn:
          text: "Not Now"
          optional: true

# Verify home screen loads - proof login succeeded
- extendedWaitUntil:
    visible:
      id: "bottomBarHomeBtn"
    timeout: 30000
- assertNotVisible:
    text: "Invalid identifier or password"
- assertNotVisible:
    text: "Internal Server Error"