# Torah Social: Login and session persistence
appId: com.davidpovarsky.torahsocial
---
- launchApp:
    appId: "com.davidpovarsky.torahsocial"

- runFlow:
    when:
      notVisible:
        id: "bottomBarHomeBtn"
    commands:
      # Dismiss email verification modal if already covering screen
      - runFlow:
          when:
            visible: "Maybe later"
          commands:
            - tapOn: "Maybe later"

      # If not yet on the login form, wait for splash screen Sign in button and tap it
      - runFlow:
          when:
            notVisible:
              id: "loginUsernameInput"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "signInButton"
                timeout: 30000
            - tapOn:
                id: "signInButton"
      - runFlow:
          when:
            notVisible:
              id: "loginUsernameInput"
          commands:
            - tapOn: "Sign in"
      - extendedWaitUntil:
          visible:
            id: "loginUsernameInput"
          timeout: 20000
      # Configure manual PDS provider if selectServiceButton is present
      - runFlow:
          when:
            visible:
              id: "selectServiceButton"
          commands:
            - tapOn:
                id: "selectServiceButton"
            - runFlow:
                when:
                  visible:
                    id: "manualSelectBtn"
                commands:
                  - tapOn:
                      id: "manualSelectBtn"
            - tapOn:
                id: "customServerTextInput"
            - inputText: "${TORAH_PDS_HOST}"
            - tapOn:
                id: "doneBtn"
      # Fill credentials
      - tapOn:
          id: "loginUsernameInput"
      - inputText: "${E2E_USER_A_FULL_HANDLE}"
      - tapOn:
          id: "loginPasswordInput"
      - inputText: "${E2E_USER_A_PASSWORD}"
      # Wait for loginNextButton to become active (connecting to service completes)
      - extendedWaitUntil:
          visible:
            id: "loginNextButton"
          timeout: 15000
      - tapOn:
          id: "loginNextButton"
      - pressKey: Enter
      # Dismiss confirmation dialog if shown for custom PDS
      - tapOn:
          text: "Continue"
          optional: true
      # Dismiss iOS keychain save password prompt if shown
      - tapOn:
          text: "Not Now"
          optional: true
      # Handle Age Assurance / Birthdate if prompt appears
      - runFlow:
          when:
            visible: "Add your birthdate"
          commands:
            - tapOn: "Add your birthdate"
            - extendedWaitUntil:
                visible: "Save"
                timeout: 10000
                optional: true
            - tapOn:
                text: "Save"
                optional: true
            - tapOn:
                text: "Done"
                optional: true
      # Dismiss email verification modal if covering home screen
      - runFlow:
          when:
            visible: "Maybe later"
          commands:
            - tapOn: "Maybe later"

# Dismiss email verification modal if covering home screen
- extendedWaitUntil:
    visible:
      id: "bottomBarHomeBtn"
    timeout: 10000
    optional: true

- runFlow:
    when:
      visible: "Maybe later"
    commands:
      - tapOn: "Maybe later"

# Verify home screen loads - proof login succeeded
- extendedWaitUntil:
    visible:
      id: "bottomBarHomeBtn"
    timeout: 30000
- assertNotVisible:
    text: "Invalid identifier or password"
- assertNotVisible:
    text: "Incorrect username or password"
- assertNotVisible:
    text: "Internal Server Error"