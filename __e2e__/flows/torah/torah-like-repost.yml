# Torah Social: Like/unlike, repost/unrepost
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000
# Post something to like
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible:
      id: "composerPublishBtn"
    timeout: 10000
- inputText: "Like test post ${E2E_RUN_ID}"
- tapOn:
    id: "composerPublishBtn"
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 15000
- tapOn:
    id: "e2eRefreshHome"
    optional: true
# Like
- extendedWaitUntil:
    visible:
      id: "likeBtn"
    timeout: 15000
- tapOn:
    id: "likeBtn"
- waitForAnimationToEnd
# Unlike
- tapOn:
    id: "likeBtn"
- waitForAnimationToEnd
# Repost
- tapOn:
    id: "repostBtn"
- tapOn:
    text: "Repost"
    optional: true
- waitForAnimationToEnd
# Undo repost
- tapOn:
    id: "repostBtn"
- tapOn:
    text: "Remove repost"
    optional: true
- waitForAnimationToEnd
- assertNotVisible:
    text: "Internal Server Error"