# Torah Social: Like/unlike, repost/unrepost
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000
# Post something to like
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- inputText: "Like test post ${E2E_RUN_ID}"
- tapOn:
    id: "composerPublishBtn"
    optional: true
- tapOn:
    text: "Post"
    optional: true
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 15000
- tapOn:
    id: "e2eRefreshHome"
    optional: true
# Like and Repost
- runFlow:
    when:
      notVisible:
        id: "likeBtn"
    commands:
      - tapOn:
          id: "bottomBarProfileBtn"
          optional: true
- extendedWaitUntil:
    visible:
      id: "likeBtn"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "likeBtn"
    commands:
      # Like
      - tapOn:
          id: "likeBtn"
      - waitForAnimationToEnd
      # Unlike
      - tapOn:
          id: "likeBtn"
      - waitForAnimationToEnd
      # Repost
      - tapOn:
          id: "repostBtn"
          optional: true
      - tapOn:
          text: "Repost"
          optional: true
      - waitForAnimationToEnd
      # Undo repost
      - tapOn:
          id: "repostBtn"
          optional: true
      - tapOn:
          text: "Remove repost"
          optional: true
      - waitForAnimationToEnd
- assertNotVisible:
    text: "Internal Server Error"