# Torah Social: Composer - Automatic Torah source detection and attachment
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
# Dismiss tooltip if present
- runFlow:
    when:
      visible: "Psst! You can edit who can interact with this post."
    commands:
      - tapOn: "Psst! You can edit who can interact with this post."
# Type Hebrew text containing a recognized Torah citation
- tapOn:
    id: "composerTextInput"
    optional: true
- inputText: "שלום עולם ברכות ב ע\"א תורה"
- waitForAnimationToEnd:
    timeout: 2500
# Verify detection UI appears
- extendedWaitUntil:
    visible: "הצמד"
    timeout: 15000
- takeScreenshot: "torah-source-detected"
# Attach detected Torah source
- tapOn:
    text: "הצמד"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "torah-source-attached"
# Verify no crash or error states
- assertNotVisible:
    text: "ReferenceError"
- assertNotVisible:
    text: "TypeError"
- assertNotVisible:
    text: "Invariant Violation"
# Cancel composer to keep environment clean
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Discard"
    optional: true
