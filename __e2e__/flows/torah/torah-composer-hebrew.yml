# Torah Social: Composer - Hebrew post and RTL input
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
# Dismiss tooltip if present
- runFlow:
    when:
      visible: "Psst! You can edit who can interact with this post."
    commands:
      - tapOn: "Psst! You can edit who can interact with this post."
# Type Hebrew text
- tapOn:
    id: "composerTextInput"
    optional: true
- inputText: "בדיקת E2E - פוסט עברי - ${E2E_RUN_ID}"
# Verify input did not crash
- assertNotVisible:
    text: "ReferenceError"
- assertNotVisible:
    text: "TypeError"
# Publish post
- tapOn:
    id: "composerPublishBtn"
    optional: true
- tapOn:
    text: "Post"
    optional: true
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 15000