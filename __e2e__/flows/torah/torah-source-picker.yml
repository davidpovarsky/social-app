# Torah Social: Sefaria source picker in composer
appId: com.davidpovarsky.torahsocial
---
- runFlow:
    file: torah-login-session.yml
- extendedWaitUntil:
    visible:
      id: "composeFAB"
    timeout: 20000
- tapOn:
    id: "composeFAB"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
# Open Torah source picker
- tapOn:
    text: "מקור"
    optional: true
- runFlow:
    when:
      visible: "הוסף מקור תורני"
    commands:
      - takeScreenshot: "source-picker-open"
      # Search for a Torah text
      - tapOn:
          text: "חיפוש מקור תורני"
          optional: true
      - inputText: "Genesis 1"
      - waitForAnimationToEnd
      - takeScreenshot: "source-search-results"
      # Close picker without corrupting composer state
      - tapOn:
          text: "סגור"
          optional: true
- assertNotVisible:
    text: "ReferenceError"
- assertNotVisible:
    text: "TypeError"
- assertNotVisible:
    text: "Invariant Violation"
# Cancel composer
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Discard"
    optional: true