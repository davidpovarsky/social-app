name: Torah Social Foundation

on:
  push:
    branches:
      - codex/torah-social-foundation
      - codex/torah-social-runtime-repair
      - codex/torah-social-rtl-docked-reader-20261106
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: torah-social-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_TORAH_WEB_HOST: https://torah-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_APPVIEW_HOST: https://appview-130-110-238-163.nip.io
      EXPO_PUBLIC_BLUESKY_PROXY_DID: did:key:zQ3shmuFmJgBGwJugBx4QhgKV5uBW3Qd7RTWMMQto6r8Gug8H
      EXPO_PUBLIC_CHAT_PROXY_DID: did:web:appview-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_PDS_DID: did:web:pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_PDS_HOST: https://pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_ISOLATED_NETWORK: "true"
      EXPO_PUBLIC_ENV: production
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
          run_install: false
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Compile locale catalogs
        run: pnpm intl:compile
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      # Upstream's original unit tests assert public Bluesky defaults. Run them
      # BEFORE the isolated build script patches constants and composer wiring.
      - name: Run upstream compatibility unit tests
        env:
          EXPO_PUBLIC_TORAH_ISOLATED_NETWORK: 'false'
          EXPO_PUBLIC_TORAH_APPVIEW_HOST: ''
          EXPO_PUBLIC_TORAH_PDS_HOST: ''
          EXPO_PUBLIC_TORAH_PDS_DID: ''
          EXPO_PUBLIC_BLUESKY_PROXY_DID: ''
          EXPO_PUBLIC_CHAT_PROXY_DID: ''
        run: pnpm test-ci
      - name: Run Torah source detection tests
        run: node scripts/test-torah.mjs
      - name: Apply isolated Torah network build config
        run: node scripts/torah-isolate-client.mjs
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Typecheck all platforms
        run: pnpm typecheck
      - name: Lint merged source
        run: pnpm lint
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: pnpm build-web
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: torah-social-web
          # Expo exports to dist/, then post-web-build.js stages deployable
          # server assets in bskyweb/. The old web-build/ path never existed.
          path: bskyweb/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS and iPad unsigned IPA build
    # The hosted macOS 15 ARM64 pool intermittently fails to allocate a runner,
    # cancelling queued jobs after about 15 min before any step executes.
    # Use the separate Intel/macOS 26 pool; its image includes Xcode 26.3.
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_TORAH_WEB_HOST: https://torah-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_APPVIEW_HOST: https://appview-130-110-238-163.nip.io
      EXPO_PUBLIC_BLUESKY_PROXY_DID: did:key:zQ3shmuFmJgBGwJugBx4QhgKV5uBW3Qd7RTWMMQto6r8Gug8H
      EXPO_PUBLIC_CHAT_PROXY_DID: did:web:appview-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_PDS_DID: did:web:pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_PDS_HOST: https://pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_ISOLATED_NETWORK: "true"
      EXPO_PUBLIC_ENV: production
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Select Xcode 26.3 (GitHub-hosted macOS 26 Intel)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.3'
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
          run_install: false
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Compile locale catalogs
        run: pnpm intl:compile
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Apply isolated Torah network build config
        run: node scripts/torah-isolate-client.mjs
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Apply narrow Expo JSI 58 Swift 6 actor compatibility fix
        run: node scripts/patch-expo-jsi-concurrency.mjs
      - name: Generate native iOS project and install pods
        run: pnpm prebuild --platform ios
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build unsigned iOS device application
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo 'No Xcode workspace generated.' >&2
            exit 1
          fi

          APP_SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          SCHEMES_JSON="$(xcodebuild -workspace "$WORKSPACE" -list -json)"
          SCHEME="$(printf '%s' "$SCHEMES_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); wanted=sys.argv[1]; schemes=d["workspace"]["schemes"]; print(wanted if wanted in schemes else "")' "$APP_SCHEME")"
          if [ -z "$SCHEME" ]; then
            echo "Expected app scheme '$APP_SCHEME' was not found in $WORKSPACE." >&2
            printf '%s\n' "$SCHEMES_JSON" >&2
            exit 1
          fi
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          # Expo Modules JSI 58.0.22 already uses
          # expo.RuntimeScheduler.create() factories and private C++ constructors.
          # The legacy Xcode 16 shim injects free factory functions that call
          # private constructors and breaks the current upstream SDK.
          # Do not run scripts/fix-expo-modules-jsi.mjs for this toolchain.
          echo "Building app scheme for iOS device: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name "${SCHEME}.app" -print -quit)"
          if [ -z "$APP" ]; then
            APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -path '*Release-iphoneos*' -name '*.app' -print -quit)"
          fi
          if [ -z "$APP" ]; then
            echo 'No Release-iphoneos .app produced.' >&2
            echo 'Products found:' >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print >&2 || true
            exit 1
          fi
          echo "Packaging unsigned IPA from $APP"
          mkdir -p "$RUNNER_TEMP/ipa_pack/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa_pack/Payload/"
          cd "$RUNNER_TEMP/ipa_pack"
          zip -r -y "$RUNNER_TEMP/TorahSocial-unsigned.ipa" Payload
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@61b34ae6d31e94afb6ceb8a836742275c495b0e2
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: torah-social-unsigned-ipa
          path: ${{ runner.temp }}/TorahSocial-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
