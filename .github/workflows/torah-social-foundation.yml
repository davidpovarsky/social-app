name: Torah Social Foundation

on:
  push:
    branches:
      - codex/torah-social-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: torah-social-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_TORAH_APPVIEW_HOST: https://appview-130-110-238-163.nip.io
      EXPO_PUBLIC_BLUESKY_PROXY_DID: did:key:zQ3shmuFmJgBGwJugBx4QhgKV5uBW3Qd7RTWMMQto6r8Guq8H
      EXPO_PUBLIC_TORAH_PDS_DID: did:web:pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_PDS_HOST: https://pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_ISOLATED_NETWORK: "true"
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile locale catalogs
        run: pnpm intl:compile
      - name: Apply isolated Torah network build config
        run: node scripts/torah-isolate-client.mjs
      - run: pnpm typecheck:web
      - run: pnpm build-web
      - uses: actions/upload-artifact@v4
        with:
          name: torah-social-web
          path: web-build
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS and iPad unsigned IPA build
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_TORAH_APPVIEW_HOST: https://appview-130-110-238-163.nip.io
      EXPO_PUBLIC_BLUESKY_PROXY_DID: did:key:zQ3shmuFmJgBGwJugBx4QhgKV5uBW3Qd7RTWMMQto6r8Guq8H
      EXPO_PUBLIC_TORAH_PDS_DID: did:web:pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_PDS_HOST: https://pds-130-110-238-163.nip.io
      EXPO_PUBLIC_TORAH_ISOLATED_NETWORK: "true"
      EXPO_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode 16
        run: |
          for xcode_path in \
            "/Applications/Xcode.app" \
            "/Applications/Xcode_16.4.app" \
            "/Applications/Xcode_16.4.0.app" \
            "/Applications/Xcode_16.3.app" \
            "/Applications/Xcode_16.2.app"; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting Xcode at $xcode_path"
              sudo xcode-select -s "$xcode_path"
              echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          swift --version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure Swift tools compatibility for ExpoModulesJSI
        run: |
          rm -rf node_modules/expo-modules-jsi/apple/Products node_modules/expo-modules-jsi/apple/.build node_modules/expo-modules-jsi/apple/.DerivedData || true
          node scripts/fix-expo-modules-jsi.mjs
      - name: Compile locale catalogs
        run: pnpm intl:compile
      - name: Apply isolated Torah network build config
        run: node scripts/torah-isolate-client.mjs
      - name: Generate native iOS project and install pods
        run: pnpm prebuild --platform ios
      - name: Configure CocoaPods project build settings
        run: |
          node -e '
            const fs = require("fs");
            const pbx = "ios/Pods/Pods.xcodeproj/project.pbxproj";
            if (fs.existsSync(pbx)) {
              let c = fs.readFileSync(pbx, "utf8");
              c = c.replace(/SWIFT_TREAT_WARNINGS_AS_ERRORS = YES/g, "SWIFT_TREAT_WARNINGS_AS_ERRORS = NO");
              c = c.replace(/SWIFT_VERSION = 6\.0;/g, "SWIFT_VERSION = 5.0;");
              c = c.replace(/SWIFT_STRICT_CONCURRENCY = complete;/g, "SWIFT_STRICT_CONCURRENCY = minimal;");
              fs.writeFileSync(pbx, c, "utf8");
              console.log("[Pods.xcodeproj] Configured SWIFT_TREAT_WARNINGS_AS_ERRORS = NO, SWIFT_VERSION = 5.0, SWIFT_STRICT_CONCURRENCY = minimal");
            }
          '
      - name: Build unsigned iOS device application
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo 'No Xcode workspace generated.' >&2
            exit 1
          fi

          APP_SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          SCHEMES_JSON="$(xcodebuild -workspace "$WORKSPACE" -list -json)"
          SCHEME="$(printf '%s' "$SCHEMES_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); wanted=sys.argv[1]; schemes=d["workspace"]["schemes"]; print(wanted if wanted in schemes else "")' "$APP_SCHEME")"
          if [ -z "$SCHEME" ]; then
            echo "Expected app scheme '$APP_SCHEME' was not found in $WORKSPACE." >&2
            printf '%s\n' "$SCHEMES_JSON" >&2
            exit 1
          fi
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          node scripts/fix-expo-modules-jsi.mjs
          echo "Building app scheme for iOS device: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name "${SCHEME}.app" -print -quit)"
          if [ -z "$APP" ]; then
            APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -path '*Release-iphoneos*' -name '*.app' -print -quit)"
          fi
          if [ -z "$APP" ]; then
            echo 'No Release-iphoneos .app produced.' >&2
            echo 'Products found:' >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print >&2 || true
            exit 1
          fi
          echo "Packaging unsigned IPA from $APP"
          mkdir -p "$RUNNER_TEMP/ipa_pack/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa_pack/Payload/"
          cd "$RUNNER_TEMP/ipa_pack"
          zip -r -y "$RUNNER_TEMP/TorahSocial-unsigned.ipa" Payload
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: torah-social-unsigned-ipa
          path: ${{ runner.temp }}/TorahSocial-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
