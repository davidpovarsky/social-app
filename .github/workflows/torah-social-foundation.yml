name: Torah Social Foundation

on:
  push:
    branches:
      - codex/torah-social-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: torah-social-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile locale catalogs
        run: pnpm intl:compile
      - name: Apply isolated Torah network build config
        env:
          EXPO_PUBLIC_TORAH_APPVIEW_HOST: https://appview.torah.invalid
          EXPO_PUBLIC_BLUESKY_PROXY_DID: did:key:zQ3shTorahSocialCiAppView
          EXPO_PUBLIC_TORAH_PDS_DID: did:web:pds.torah.invalid
        run: node scripts/torah-isolate-client.mjs
      - run: pnpm typecheck:web
      - run: pnpm build-web
      - uses: actions/upload-artifact@v4
        with:
          name: torah-social-web
          path: web-build
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS and iPad simulator build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile locale catalogs
        run: pnpm intl:compile
      - name: Apply isolated Torah network build config
        env:
          EXPO_PUBLIC_TORAH_APPVIEW_HOST: https://appview.torah.invalid
          EXPO_PUBLIC_BLUESKY_PROXY_DID: did:key:zQ3shTorahSocialCiAppView
          EXPO_PUBLIC_TORAH_PDS_DID: did:web:pds.torah.invalid
        run: node scripts/torah-isolate-client.mjs
      - name: Generate native iOS project and install pods
        run: pnpm prebuild --platform ios
      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo 'No Xcode workspace generated.' >&2
            exit 1
          fi

          APP_SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          SCHEMES_JSON="$(xcodebuild -workspace "$WORKSPACE" -list -json)"
          SCHEME="$(printf '%s' "$SCHEMES_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); wanted=sys.argv[1]; schemes=d["workspace"]["schemes"]; print(wanted if wanted in schemes else "")' "$APP_SCHEME")"
          if [ -z "$SCHEME" ]; then
            echo "Expected app scheme '$APP_SCHEME' was not found in $WORKSPACE." >&2
            printf '%s\n' "$SCHEMES_JSON" >&2
            exit 1
          fi

          echo "Building app scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -path '*iphonesimulator*' -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'No simulator .app produced.' >&2
            echo 'Products found:' >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print >&2 || true
            exit 1
          fi
          echo "Packaging simulator app: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/TorahSocial-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: torah-social-ios-simulator
          path: ${{ runner.temp }}/TorahSocial-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
