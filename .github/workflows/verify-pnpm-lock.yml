name: Lockfile

on:
  pull_request:
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-pnpm-lock:
    name: Dependency-lock consistency
    runs-on: ubuntu-latest
    steps:
      # Temporary until fixed runner images roll out:
      # https://github.com/actions/runner-images/issues/15018
      - name: Update Ubuntu CA certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates

      - name: ⬇️ Check out PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: 🔧 Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: 📦 pnpm install
        # Validate the committed merge lock and its patch/policy configuration.
        # This checks dependency consistency, not whether the lock was hand-edited.
        run: pnpm clean && pnpm install --ignore-scripts --frozen-lockfile

      - name: 🔍 Verify dependency files remain unchanged
        run: |
          git diff --quiet --exit-code || {
            echo '::error::The frozen install changed tracked files. Commit dependency manifests, lockfile, patches, and policy configuration consistently.'
            git --no-pager diff
            exit 1
          }
